networks:
  traefik-public:
    external: true

services:
  uptime-endpoint:
    image: registry.rmnad.net/uptime-endpoint:latest
    networks:
      - traefik-public
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.uptimeendpoint.rule=Host(`test.rmnad.net`)"
        - "traefik.http.routers.uptimeendpoint.entrypoints=websecure"
        - "traefik.http.routers.uptimeendpoint.tls=true"
        - "traefik.http.routers.uptimeendpoint.priority=1"
        - "traefik.http.services.uptimeendpoint.loadbalancer.server.port=80"
        - "traefik.http.services.uptimeendpoint.loadbalancer.healthcheck.path=/"
        - "traefik.http.services.uptimeendpoint.loadbalancer.healthcheck.interval=10s"
